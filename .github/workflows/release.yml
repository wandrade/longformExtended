name: Release

# Release only after a PR that carries the `release` label is merged into main.
# `pull_request` (not `pull_request_target`) keeps the token scoped to this
# workflow, and the job is skipped for unmerged, unlabeled, `no-release`, and
# contradictory (both labels) pull requests.
on:
  pull_request:
    branches: [main]
    types: [closed]

# Least privilege: creating the tag and GitHub release needs write access.
permissions:
  contents: write

# Serialize releases. Do not cancel a release that is already running; a
# duplicate/queued run will fail its tag check instead of racing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release') &&
      !contains(github.event.pull_request.labels.*.name, 'no-release')
    runs-on: ubuntu-latest
    steps:
      # Check out the actual merge commit, with full history/tags so the
      # version gate can compare against released tags.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci

      - name: Verify merge commit
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if [ -z "${MERGE_SHA}" ]; then
            echo "::error::The merged pull request has no merge commit SHA."
            exit 1
          fi
          checked_out="$(git rev-parse HEAD)"
          if [ "${checked_out}" != "${MERGE_SHA}" ]; then
            echo "::error::Checked out ${checked_out}, expected merge commit ${MERGE_SHA}."
            exit 1
          fi
          echo "Release target: ${MERGE_SHA}"

      - name: Run unit tests
        run: npm run test:unit -- --run

      - name: Build production assets
        run: npm run build

      # Blocking by design: no release while the source review has errors.
      - name: Obsidian review preflight
        run: npx --yes obsidian-plugin-validator@1.0.6

      - name: Determine and validate version
        id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./manifest.json').version")"
          echo "value=${version}" >> "$GITHUB_OUTPUT"
          # Strict mode: the release must be strictly greater than the latest
          # release tag (or the first release when no tag exists).
          node .github/scripts/check-version.mjs --mode release

      - name: Verify the tag does not already exist
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::Tag ${VERSION} already exists; refusing to release."
            exit 1
          elif [ "$status" -ne 2 ]; then
            # Exit 2 means "no matching refs"; anything else is a real error and
            # must not be treated as "tag is absent".
            echo "::error::Could not verify tag ${VERSION} (git ls-remote exit ${status})."
            exit 1
          fi

      - name: Verify release assets exist
        run: |
          set -euo pipefail
          for file in main.js manifest.json styles.css; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing release asset: ${file}"
              exit 1
            fi
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if [ -z "${MERGE_SHA}" ]; then
            echo "::error::Cannot tag an empty merge commit SHA."
            exit 1
          fi
          gh release create "$VERSION" \
            --target "$MERGE_SHA" \
            --title "$VERSION" \
            --generate-notes \
            main.js manifest.json styles.css
