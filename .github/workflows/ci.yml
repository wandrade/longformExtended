name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# A newer push to the same PR supersedes the previous run.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test:unit -- --run

  build:
    name: Production build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build

  review:
    name: Obsidian review preflight
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Blocking by design. The existing source cleanup (359 errors / 71
      # warnings) is tracked separately; this check will be red until it is
      # done. If an advisory phase is ever needed, add
      # `continue-on-error: true` here as an explicit, visible change, then
      # remove it once the cleanup lands.
      - run: npx --yes obsidian-plugin-validator@1.0.6

  version-bump:
    name: Version bump
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      # Full history is required so git tags (released versions) are present.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check version against the latest release tag
        run: node .github/scripts/check-version.mjs --mode pr
