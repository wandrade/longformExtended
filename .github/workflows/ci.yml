name: CI

on:
  pull_request:
    branches: [main]
    # `labeled`/`unlabeled` re-run the gate when the release label changes, so
    # a stale green check cannot survive an edit to the release decision.
    types:
      [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# A newer push to the same PR supersedes the previous run.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-label:
    name: Release label
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Exactly one of `release` / `no-release` is required. The label names are
      # passed as JSON so labels containing spaces stay unambiguous.
      - name: Require exactly one of release / no-release
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node .github/scripts/check-release-label.mjs

  unit-tests:
    name: Unit tests
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test:unit -- --run

  build:
    name: Production build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build

  review:
    name: Obsidian review preflight
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Blocking by design. The existing source cleanup (359 errors / 71
      # warnings) is tracked separately; this check will be red until it is
      # done. If an advisory phase is ever needed, add
      # `continue-on-error: true` here as an explicit, visible change, then
      # remove it once the cleanup lands.
      - run: npx --yes obsidian-plugin-validator@1.0.6

  version-bump:
    name: Version bump
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      # Full history is required so git tags (released versions) are present.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Reuse the label gate so neither/both labels fail this job as well. A
      # failed step stops the job, so no version check can silently pass.
      - name: Determine release label
        id: label
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node .github/scripts/check-release-label.mjs --github-output
      # release: manifest version must be strictly greater than the latest tag.
      - name: Check strict version bump
        if: steps.label.outputs.mode == 'release'
        run: node .github/scripts/check-version.mjs --mode pr
      # no-release: no bump required, but the version files must agree.
      - name: Check version consistency without a bump
        if: steps.label.outputs.mode == 'no-release'
        run: node .github/scripts/check-version.mjs --mode pr --allow-no-bump
